# Minimal CI — launch blocker WS-B (audit 2026-07-07, ci-cd-testing CRITICAL).
#
# Two jobs on every push/PR to main:
#   backend  — pytest suite against postgres:15 + redis:7 services
#   frontend — npm ci + astro check + astro build (both verified green locally
#              on 2026-07-07 with the exact lockfile versions, so both block)
#
# Env notes (derived from backend/tests/conftest.py + backend/conftest.py):
#   * TEST_DATABASE_URL — conftest defaults to localhost:5435 (the local dev
#     test-db port mapping); in CI the postgres service is on 5432, so we set
#     it explicitly.
#   * DATABASE_URL — the app engine (app/core/database.py) is created at import
#     time from this; tests/test_health_readiness.py pings it via /ready, so it
#     must point at a reachable DB. We point it at the same CI test database.
#   * REDIS_URL — tests/test_scheduler_lock.py and /ready need a LIVE redis.
#   * JARVIS_MCP_HTTP_ENABLED is set by backend/conftest.py itself.
#   * DEBUG defaults to true → rate limiter off, placeholder SECRET_KEY allowed.
#   * Coverage gate (--cov-fail-under=70) comes from backend/pytest.ini addopts.
#
# UNVERIFIED-IN-CI: the backend suite was validated by file inspection only
# (local test DB was shared with sibling agents at authoring time). First push
# validates it for real; if a test turns out to need extra env, add it to the
# pytest step's env block below.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: familyapp
          POSTGRES_PASSWORD: familyapp123
          POSTGRES_DB: familyapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U familyapp -d familyapp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        # requirements-dev.txt includes requirements.txt via its -r directive
        # and adds pytest/pytest-asyncio/pytest-cov (needed by pytest.ini addopts).
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        # Zero-tolerance: the tree was brought to a clean `ruff check` on
        # 2026-07-16 (config in backend/ruff.toml); keep it that way.
        run: ruff check app

      - name: Run migrations (alembic upgrade head + downgrade round-trip)
        # Prod deploys run `alembic upgrade head` for real — CI must exercise
        # the chain first so a broken migration fails here, not on the host.
        # migrations/env.py reads DATABASE_URL and strips +asyncpg for its
        # sync engine (psycopg2-binary comes from requirements.txt). The
        # downgrade -1 / upgrade head round-trip exercises the NEWEST
        # migration's downgrade path (the manual rollback documented in
        # deploy-onprem.sh). Safe before pytest: tests/conftest.py drops and
        # recreates every table except alembic_version at session start.
        env:
          DATABASE_URL: postgresql+asyncpg://familyapp:familyapp123@localhost:5432/familyapp_test
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Schema parity (migrations vs ORM models)
        # The step above builds the schema from the migration chain, then
        # conftest.py drops it and rebuilds from Base.metadata.create_all — so
        # every test runs against the ORM schema and never the one production
        # has. Anything enforced on only one side is invisible: when this gate
        # was added, four CHECK constraints and two partial unique indexes
        # existed in production but not in the models, and an MCP tool call
        # could create a gig with points=-500 that only production refused.
        #
        # Runs BEFORE pytest, while the DB is still migration-derived. Compares
        # constraints/columns/enums by definition rather than by name; alembic's
        # own `check` does not diff CHECK constraints at all, which is exactly
        # where this repo's drift lives.
        env:
          DATABASE_URL: postgresql+asyncpg://familyapp:familyapp123@localhost:5432/familyapp_test
          ORM_DATABASE_URL: postgresql://familyapp:familyapp123@localhost:5432/familyapp_ormparity
          PYTHONPATH: .
        run: python scripts/check_schema_parity.py

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://familyapp:familyapp123@localhost:5432/familyapp_test
          DATABASE_URL: postgresql+asyncpg://familyapp:familyapp123@localhost:5432/familyapp_test
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: .
          # No /app on the runner; upload tests write here instead (see app/core/config.py UPLOADS_ROOT)
          UPLOADS_ROOT: ${{ runner.temp }}/uploads
        run: pytest tests/

  frontend:
    name: Frontend (check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      # Full-repo checkout is required: help.astro / ayuda.astro import
      # markdown from the top-level docs/ tree during the build.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # Matches frontend/Dockerfile (node:22-alpine).
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro check)
        # Green locally (0 errors / 0 warnings, hints only) — kept blocking.
        run: npm run check

      - name: Unit tests (vitest)
        # middleware.ts owns the CSRF origin check, the public-route list and
        # the admin-surface match. Until these existed the check could have been
        # inverted and every signal here would have stayed green — the only
        # coverage was an e2e spec that does not run in CI.
        run: npm test

      - name: Build
        run: npm run build

  # A compose value that is valid YAML can still be invalid to podman. A
  # generated `max-size: \"20m\"` (literal backslashes) passed yaml.safe_load
  # and then took production down: podman answered
  # `strconv.ParseFloat: parsing "\"20": invalid syntax`, the deploy's `down`
  # had already run, and every service failed to come back up.
  compose-lint:
    name: Compose files parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate compose YAML and scalar values
        run: |
          pip install pyyaml
          python - <<'PY'
          import sys, yaml, pathlib
          bad = []
          for name in ("docker-compose.yml", "docker-compose.onprem.yml"):
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              doc = yaml.safe_load(path.read_text())
              for svc, cfg in (doc.get("services") or {}).items():
                  for key, val in ((cfg.get("logging") or {}).get("options") or {}).items():
                      text = str(val)
                      # The exact shape that broke prod: quotes that survived
                      # into the value itself rather than being YAML syntax.
                      if '"' in text or "\\" in text:
                          bad.append(f"{name}:{svc}: logging option {key}={text!r} contains quoting podman will reject")
                  for key in ("mem_limit", "stop_grace_period"):
                      if key in cfg and ('"' in str(cfg[key]) or "\\" in str(cfg[key])):
                          bad.append(f"{name}:{svc}: {key}={cfg[key]!r} contains stray quoting")
          if bad:
              print("Compose value check FAILED:")
              for line in bad:
                  print("  -", line)
              sys.exit(1)
          print("compose files parse and scalar values are clean")
          PY

  # Nothing was watching the dependency pins or scanning for committed secrets.
  # This repo handles PayPal, LiteLLM, SMTP and OAuth credentials, and shipped
  # authlib 1.3.0 (CVE-2024-37568, imported nowhere) for months unnoticed.
  #
  # Now BLOCKING. It was advisory while the backlog existed: pip-audit found 36
  # advisories on the old web stack and npm audit found 14 on astro 5. Both are
  # at zero after the dependency chain and the astro 7 migration, so the check
  # can hold that line instead of being a red badge everyone learns to ignore.
  supply-chain:
    name: Supply chain (audit + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs history to scan commits, not just the tip tree.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit --requirement backend/requirements.txt --desc

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm audit (frontend, prod deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
